{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="formulario-caixa">
  <h1>Entrar no ChamaTI</h1>
  {% include "partials/campo_erro.html" %}

  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo {% if campo_erro == 'email' %}campo--invalido{% endif %}">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username"
             value="{{ dados.email or '' }}" required>
    </div>

    <div class="campo {% if campo_erro == 'senha' %}campo--invalido{% endif %}">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>

    <button class="botao botao--primario botao--bloco" type="submit">Entrar</button>
  </form>

  <p class="formulario-caixa__rodape">
    Ainda não tem conta? <a href="{{ url_for('auth.cadastro_form') }}">Criar conta</a>
  </p>
</section>
{% endblock %}
