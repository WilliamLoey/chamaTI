{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<section class="formulario-caixa">
  <h1>Criar conta</h1>
  {% include "partials/campo_erro.html" %}

  <form method="post" action="{{ url_for('auth.cadastro') }}" novalidate>
    <div class="campo {% if campo_erro == 'nome' %}campo--invalido{% endif %}">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" value="{{ dados.nome or '' }}"
             autocomplete="name" required>
    </div>

    <div class="campo {% if campo_erro == 'email' %}campo--invalido{% endif %}">
      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" name="email" value="{{ dados.email or '' }}"
             autocomplete="email" required>
    </div>

    <div class="campo {% if campo_erro == 'senha' %}campo--invalido{% endif %}">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="new-password"
             minlength="6" required>
      <small class="campo__ajuda">Use pelo menos 6 caracteres.</small>
    </div>

    <div class="campo">
      <label for="departamento">Departamento <span class="campo__opcional">(opcional)</span></label>
      <input type="text" id="departamento" name="departamento"
             value="{{ dados.departamento or '' }}">
    </div>

    <div class="campo {% if campo_erro == 'perfil' %}campo--invalido{% endif %}">
      <label for="perfil">Perfil de acesso</label>
      <select id="perfil" name="perfil">
        {% for valor, rotulo in perfis.items() %}
        <option value="{{ valor }}" {% if dados.perfil == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
      </select>
      <small class="campo__ajuda">Em produção, os perfis Técnico e Gestor são
        atribuídos pelo administrador.</small>
    </div>

    <button class="botao botao--primario botao--bloco" type="submit">Criar conta</button>
  </form>

  <p class="formulario-caixa__rodape">
    Já tem conta? <a href="{{ url_for('auth.login_form') }}">Entrar</a>
  </p>
</section>
{% endblock %}
